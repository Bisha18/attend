services:
  - type: web
    name: geoattend-face-service
    runtime: python
    rootDir: face-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: test
      - key: THRESHOLD
        value: "0.55"
      - key: SELF_URL
        sync: false
      - key: KEEP_ALIVE_INTERVAL
        value: "840"
      - key: ADMIN_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.6"
